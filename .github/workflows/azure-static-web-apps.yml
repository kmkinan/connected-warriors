name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy to Azure Static Web Apps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify static site files exist
        shell: bash
        run: |
          ls -la
          test -f index.html

      - name: Inject short SHA stamp
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -f index.html ]; then
            sed -i "s/__DEPLOY_SHA__/${SHORT_SHA}/g" index.html || true
          fi

      - name: Check Azure deployment token
        id: check_token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$SWA_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.check_token.outputs.has_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Fail if Azure deployment token is missing
        if: steps.check_token.outputs.has_token == 'false'
        shell: bash
        run: |
          echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is not configured in GitHub repository secrets."
          exit 1
