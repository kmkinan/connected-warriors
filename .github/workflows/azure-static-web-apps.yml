name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject commit SHA version stamp
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/__DEPLOY_SHA__/${SHORT_SHA}/g" index.html

      - name: Resolve Azure SWA deployment token
        id: resolve_swa_token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_03CF3F80F: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_03CF3F80F }}
        run: |
          token="${AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_03CF3F80F:-$AZURE_STATIC_WEB_APPS_API_TOKEN}"
          if [ -n "$token" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "token=$token" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure SWA deployment token is unavailable for this pull_request run; skipping deploy."
          else
            echo "::error::Azure SWA deployment token is not configured."
            exit 1
          fi

      - name: Build and Deploy to Azure Static Web Apps
        if: steps.resolve_swa_token.outputs.has_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.resolve_swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: ''
          skip_app_build: true
